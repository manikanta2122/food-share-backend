server.port=${PORT:8080}

# Database Configuration (supports environment variables with secure defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodshare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mani@MySQL21}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.foodshare=INFO
logging.level.org.springframework.web=INFO
